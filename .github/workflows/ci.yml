name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned browser-test tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual extension runtime with synthetic provider responses
        run: node tests/browser-smoke.mjs
      - name: Test learning workspace in actual Chromium (synthetic provider responses)
        run: node tests/browser-workspace.mjs
