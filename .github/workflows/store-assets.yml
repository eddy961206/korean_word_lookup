name: Store assets
on:
  pull_request:
    paths:
      - marketing/capture/**
      - .github/workflows/store-assets.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node marketing/capture/store-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: korean-word-lookup-store-assets
          path: store-assets/
          if-no-files-found: error
